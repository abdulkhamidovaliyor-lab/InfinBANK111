plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.infinbank.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infinbank.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            res.srcDirs = ['res']

            assets.srcDirs = ['assets']
        }
    }
}
