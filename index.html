<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}.screen{position:relative;width:100%;height:100%;background:#fff}.shot{width:100%;height:100%;object-fit:fill;display:block}.tap{position:absolute;background:transparent;border:0;z-index:30}.nav{bottom:0;height:13%;width:25%}.n1{left:0}.n2{left:25%}.n3{left:50%}.n4{left:75%}
#pinDots{position:absolute;left:34%;top:35.5%;width:32%;height:5%;display:flex;justify-content:space-between;align-items:center;z-index:12;pointer-events:none}.dot{width:18px;height:18px;border-radius:50%;background:transparent}.dot.on{background:#14396f}.key{position:absolute;width:22%;height:9%;z-index:9;background:transparent;border:0}
.histHead{position:absolute;top:0;left:0;width:100%;height:17%;z-index:10;background:#fff}.histHead img,.histNav img{width:100%;height:100%;object-fit:fill}.histScroll{position:absolute;top:17%;bottom:13%;left:0;right:0;overflow-y:auto;background:#fff}.histSection{position:relative;width:100%}.histSection img{width:100%;display:block}.histNav{position:absolute;left:0;bottom:0;width:100%;height:13%;z-index:20;background:#fff}.histClick{position:absolute;left:8%;right:4%;height:10%;z-index:5;background:transparent;border:0}
.detail .back{left:1%;top:2%;width:16%;height:11%}.detail .receipt{left:0;top:35%;width:100%;height:13%}.detail .home{left:4%;bottom:5%;width:92%;height:9%}.receiptModal{position:absolute;inset:0;z-index:50}.receiptModal img{width:100%;height:100%;object-fit:fill}.close{right:1%;top:51%;width:14%;height:10%}
</style></head><body><div id="app"></div><script>
const A='img/';
const details=['Дизайн без названия (6).png','Дизайн без названия (2).png','Дизайн без названия (4).png','Дизайн без названия (2)(1).png','Дизайн без названия (5).png','Дизайн без названия (3).png'];
const receipts=['ChatGPT Image 22 сент. 2026 г., 01_50_33.png','5 670 000 kvitanciya.png','ChatGPT Image 22 сент. 2026 г., 01_20_17.png','ChatGPT Image 22 сент. 2026 г., 00_01_45.png','ChatGPT Image 22 сент. 2026 г., 01_15_41.png','ChatGPT Image 22 сент. 2026 г., 00_52_28.png'];
// index: 0=1 804 500, 1=5 760 000, 2=1 002 500, 3=1 960 000, 4=1 503 750, 5=1 604 000
let pin='',histY=0;
function nav(){return `<button class="tap nav n1" onclick="page('home')"></button><button class="tap nav n2" onclick="page('transfer')"></button><button class="tap nav n3" onclick="page('payments')"></button><button class="tap nav n4" onclick="page('history')"></button>`}
function page(p){const app=document.getElementById('app');if(p==='pin'){app.innerHTML=`<div class="screen"><img class="shot" src="${A}1.png"><div id="pinDots">${[0,1,2,3].map(i=>`<i class="dot" id="d${i}"></i>`).join('')}</div>${[1,2,3,4,5,6,7,8,9,0].map((n,i)=>{let r=i<9?Math.floor(i/3):3,c=i<9?i%3:1;return `<button class="key" style="left:${17+c*22}%;top:${46+r*10}%" onclick="digit('${n}')"></button>`}).join('')}<button class="key" style="left:61%;top:76%" onclick="del()"></button></div>`;return}let file={home:'2.png',transfer:'3.png',payments:'4.png'}[p];if(file){app.innerHTML=`<div class="screen"><img class="shot" src="${A+file}">${nav()}</div>`;return}if(p==='history')showHistory()}
function digit(n){if(pin.length<4){pin+=n;dots();if(pin.length===4)setTimeout(()=>{if(pin==='0000')page('home');else{pin='';dots()}},150)}}function del(){pin=pin.slice(0,-1);dots()}function dots(){for(let i=0;i<4;i++)document.getElementById('d'+i)?.classList.toggle('on',i<pin.length)}
function showHistory(){const app=document.getElementById('app');const clicks=[{i:0,t:10},{i:1,t:70},{i:2,t:18},{i:3,t:18},{i:4,t:54},{i:5,t:54}];app.innerHTML=`<div class="screen"><div class="histHead"><img src="${A}history_header.png"></div><div class="histScroll" id="hist">${clicks.map((x,s)=>`<div class="histSection"><img src="${A}history_body_${s}.png"><button class="histClick" style="top:${x.t}%" onclick="openDetail(${x.i})"></button></div>`).join('')}</div><div class="histNav"><img src="${A}history_nav.png">${nav()}</div></div>`;requestAnimationFrame(()=>document.getElementById('hist').scrollTop=histY)}
function openDetail(i){histY=document.getElementById('hist')?.scrollTop||0;document.getElementById('app').innerHTML=`<div class="screen detail"><img class="shot" src="${A+details[i]}"><button class="tap back" onclick="page('history')"></button><button class="tap receipt" onclick="showReceipt(${i})"></button><button class="tap home" onclick="page('home')"></button></div>`}
function showReceipt(i){const d=document.querySelector('.detail');const m=document.createElement('div');m.className='receiptModal';m.innerHTML=`<img src="${A+receipts[i]}"><button class="tap close" onclick="this.parentElement.remove()"></button>`;d.appendChild(m)}
page('pin');
</script></body></html>
